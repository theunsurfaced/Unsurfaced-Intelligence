<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unsurfaced™ — Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A0A; --ivory:#FAF7F2; --red:#FF3333; --text2:#8988A0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--ivory); font-family:'Space Mono', monospace; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:16px 22px; }
  .mark { font-family:'Syne', sans-serif; font-weight:800; font-size:18px; letter-spacing:-.01em; }
  .mark sup { font-size:9px; }
  .tag { font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--text2); }
  .stage { position:relative; width:100%; height:calc(100vh - 96px); display:flex; align-items:center; justify-content:center; padding:0 12px; }
  .frame { position:relative; width:min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio:16/9; border:1px solid rgba(255,255,255,.12); background:#000; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .foot { display:flex; justify-content:space-between; padding:10px 22px 16px; font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:var(--text2); }
  .foot span b { color:var(--red); font-weight:400; }
  @media (max-width:700px) {
    .top { padding:12px 14px; }
    .mark { font-size:15px; }
    .tag { display:none; }
    .stage { height:auto; padding:0 8px; }
    .frame { width:100%; }
    .foot { padding:8px 14px 12px; }
  }
</style>
</head>
<body>
  <div class="top">
    <div class="mark">Unsurfaced<sup>™</sup></div>
    <div class="tag">Creative Recon · Private Deck</div>
  </div>
  <div class="stage">
    <div class="frame">
      <iframe
        src="https://docs.google.com/presentation/d/e/2PACX-1vTSG2lrmLo2cIg1gQvWC471VC3rwgtvj8waTMNQGYs7Bl21KR1-PBnwzkSPNkWJOY-2W-qodZnfGpFT/embed?start=false&loop=false&delayms=10000"
        allowfullscreen
        loading="eager"
        title="Unsurfaced deck"></iframe>
    </div>
  </div>
  <div class="foot">
    <span><b>■</b> Your Hidden Hand</span>
    <span>© 2026 Unsurfaced™</span>
  </div>
</body>
</html>
