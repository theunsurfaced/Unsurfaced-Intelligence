# SEAM:WATCH_LINE (EX29): the ritual gate runs on every push and pull request, so a change that fails a proof is red before it is live.
name: ritual gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ritual gate
        run: python3 tools/ritual_gate.py
