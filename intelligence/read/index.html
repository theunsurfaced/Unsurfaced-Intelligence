<title>Unsurfaced DAILY · The Read</title>

<!-- SEAM:READ_PAGE: the house read, designed. Library of every read, one read
     as a document (Download PDF prints it through the browser's own PDF engine),
     and the Weekly Read's social frames drawn as ready-to-post images. Admin
     only: every call goes through /reads/* with the signed-in session. -->
<style>
  :root {
    --void: #0A0A0A; --matte: #1A1A1A; --ivory: #FAF7F2; --cream: #F5F0E8; --paper: #EDE7DA;
    --red: #C41230; --ink: #141414; --mute: #6B6455; --line: #D9D1C1;
    --display: 'Syne', system-ui, sans-serif; --mono: 'Space Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: var(--void); color: var(--ivory); font-family: var(--display); min-height: 100vh; }
  a { color: inherit; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         padding: 14px 20px; background: rgba(10,10,10,.94); border-bottom: 1px solid #2A2A2A; font-family: var(--mono); font-size: 12px; letter-spacing: 2px; }
  .bar .who { margin-right: auto; text-transform: uppercase; opacity: .8; }
  .btn { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; background: transparent;
         color: var(--ivory); border: 1px solid #3A3A3A; padding: 9px 14px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--ivory); }
  .btn.red { background: var(--red); border-color: var(--red); }
  .msg { max-width: 760px; margin: 60px auto; padding: 0 20px; font-family: var(--mono); font-size: 13px; line-height: 1.8; letter-spacing: 1px; }
  .status { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; }
  .s-ready, .s-published { color: #6FCF97; } .s-held, .s-failed { color: #F2994A; } .s-queued, .s-compiling { color: #9A9A9A; }

  /* Library */
  .lib { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
  .lib h1 { font-weight: 800; font-size: clamp(40px, 7vw, 88px); line-height: .95; margin-bottom: 8px; }
  .lib .sub { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: #9A9A9A; margin-bottom: 36px; text-transform: uppercase; }
  .lib h2 { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--red); margin: 34px 0 12px; text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { display: block; border: 1px solid #2A2A2A; padding: 18px; text-decoration: none; min-height: 150px; }
  .card:hover { border-color: var(--ivory); }
  .card .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: #9A9A9A; text-transform: uppercase; margin-bottom: 10px; }
  .card .ttl { font-weight: 800; font-size: 20px; line-height: 1.15; margin-bottom: 12px; }

  /* The document */
  .doc { max-width: 8.5in; margin: 28px auto 80px; }
  .page { background: var(--ivory); color: var(--ink); padding: 0.75in 0.8in; margin-bottom: 18px; position: relative; }
  .page.cover { background: var(--void); color: var(--ivory); min-height: 11in; display: flex; flex-direction: column; }
  .rp-mark { width: 3.4in; height: auto; display: block; color: var(--ivory); }
  .cover .kind { font-family: var(--mono); font-size: 12px; letter-spacing: 5px; color: var(--red); margin-top: 1.1in; text-transform: uppercase; }
  .cover h1 { font-weight: 800; font-size: 60px; line-height: .98; margin: 18px 0 26px; letter-spacing: -1px; }
  .cover .thesis { font-size: 20px; line-height: 1.45; color: var(--cream); max-width: 6in; }
  .cover .foot { margin-top: auto; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border-top: 2px solid var(--red); padding-top: 14px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: .45in; border-top: 1px solid #2A2A2A; }
  .nums div { padding: 16px 12px 0 0; }
  .nums b { display: block; font-weight: 800; font-size: 40px; line-height: 1; }
  .nums span { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #9A9A9A; }
  .sec { font-family: var(--mono); font-size: 11px; letter-spacing: 5px; color: var(--red); text-transform: uppercase; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  .sec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); display: inline-block; }
  .body { font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
  h2.name { font-weight: 800; font-size: 30px; line-height: 1.08; margin: 4px 0 14px; letter-spacing: -.3px; }
  .pat { padding: 0 0 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .page.inner .pat:only-of-type, .page.inner .pat:last-child { border-bottom: 0; }
  .pat:last-child { border-bottom: 0; }
  .pnum { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--mute); }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 6px; margin-left: 8px; }
  .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--mute); margin: 10px 0 4px; }
  .ev { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px; color: var(--mute); line-height: 1.6; margin-top: 8px; }
  .moves { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 22px; margin-top: 14px; }
  .moves div { border-top: 2px solid var(--ink); padding-top: 8px; font-size: 13.5px; line-height: 1.55; }
  .moves b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }
  .pull { font-weight: 800; font-size: 24px; line-height: 1.25; border-left: 4px solid var(--red); padding-left: 18px; margin: 8px 0 22px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  ul.watch { list-style: none; } ul.watch li { font-size: 15px; line-height: 1.6; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.watch li::before { content: "→ "; color: var(--red); font-family: var(--mono); }
  .rc { font-size: 12px; line-height: 1.5; padding: 7px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; gap: 10px; break-inside: avoid; }
  .rc .id { font-family: var(--mono); font-size: 10px; color: var(--mute); padding-top: 2px; }
  .rc .src { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--mute); text-transform: uppercase; }
  .page.inner .pat h2.name { font-size: 42px; line-height: 1.02; margin: 10px 0 22px; }
  .page.inner .pat .body { font-size: 16.5px; line-height: 1.75; }
  .page.inner .pat .moves { gap: 16px 26px; margin-top: 26px; }
  .page.inner .pat .moves div { font-size: 14.5px; }
  table.flow { width: 100%; border-collapse: collapse; }
  table.flow td { padding: 0; vertical-align: top; }
  table.flow td.sp { height: 0; }
  .closer { background: var(--void); color: var(--ivory); text-align: left; }
  .closer .big { font-weight: 800; font-size: 44px; line-height: 1.02; margin: .3in 0 .25in; }
  .closer .url { font-family: var(--mono); font-size: 12px; letter-spacing: 3px; color: var(--red); text-transform: uppercase; }
  .hold { background: #2A1A08; color: #F2C48D; font-family: var(--mono); font-size: 12px; line-height: 1.7; padding: 14px 18px; margin-bottom: 18px; border: 1px solid #F2994A; }

  /* Social frames */
  .social { max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; }
  .social h2 { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 14px; }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .frames figure { border: 1px solid #2A2A2A; }
  .frames canvas { width: 100%; height: auto; display: block; }
  .frames figcaption { display: flex; justify-content: space-between; align-items: center; padding: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; }
  .cap { font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--cream); border: 1px solid #2A2A2A; padding: 14px; white-space: pre-wrap; margin-top: 10px; }

  @page { size: letter; margin: 0; }
  @media print {
    body { background: var(--ivory); }
    .bar, .social, .noprint { display: none !important; }
    .doc { max-width: none; margin: 0; }
    .page { margin: 0; min-height: 11in; break-after: page; box-shadow: none; }
    .page.inner { padding-top: 0; padding-bottom: 0; }
    table.flow td.sp { height: 0.7in; }
    .page:last-child { break-after: auto; }
  }
  @media (max-width: 700px) {
    .page { padding: 28px 22px; } .page.cover { min-height: auto; }
    .cover h1 { font-size: 40px; } .nums { grid-template-columns: repeat(2, 1fr); }
    .moves, .two { grid-template-columns: 1fr; }
  }
</style>
</head>

  }
