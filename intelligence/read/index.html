<title>Unsurfaced Intelligence · The Read</title>

<!-- SEAM:READ_PAGE: the house read, designed as a magazine. Library of every
     read; one read as a letter-size issue (photo cover, how to read it and
     contents, section openers with house explainers, pattern spreads with each
     story's own photo, by-the-numbers charts from SQL, photo receipts, closer);
     Download PDF prints it through the browser's own PDF engine; the Weekly
     Read's social frames drawn 1080 x 1350 over the stories' photos. Photos
     come through the Worker's closed relay (/img/s/<story id>). Admin only. -->
<style>
  :root {
    --void: #0A0A0A; --matte: #1A1A1A; --ivory: #FAF7F2; --cream: #F5F0E8; --paper: #EDE7DA;
    --red: #C41230; --ink: #141414; --mute: #6B6455; --line: #D9D1C1;
    --display: 'Syne', system-ui, sans-serif; --mono: 'Space Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: var(--void); color: var(--ivory); font-family: var(--display); min-height: 100vh; }
  a { color: inherit; }
  img { display: block; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         padding: 14px 20px; background: rgba(10,10,10,.94); border-bottom: 1px solid #2A2A2A; font-family: var(--mono); font-size: 12px; letter-spacing: 2px; }
  .bar .who { margin-right: auto; text-transform: uppercase; opacity: .8; }
  .btn { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; background: transparent;
         color: var(--ivory); border: 1px solid #3A3A3A; padding: 9px 14px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--ivory); }
  .btn.red { background: var(--red); border-color: var(--red); }
  .msg { max-width: 760px; margin: 60px auto; padding: 0 20px; font-family: var(--mono); font-size: 13px; line-height: 1.8; letter-spacing: 1px; }
  .status { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; }
  .s-ready, .s-published { color: #6FCF97; } .s-held, .s-failed { color: #F2994A; } .s-queued, .s-compiling { color: #9A9A9A; }

  /* Library */
  .lib { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
  .lib h1 { font-weight: 800; font-size: clamp(40px, 7vw, 88px); line-height: .95; margin-bottom: 8px; }
  .lib .sub { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: #9A9A9A; margin-bottom: 36px; text-transform: uppercase; }
  .lib h2 { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--red); margin: 34px 0 12px; text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { display: block; border: 1px solid #2A2A2A; padding: 18px; text-decoration: none; min-height: 150px; }
  .card:hover { border-color: var(--ivory); }
  .card .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: #9A9A9A; text-transform: uppercase; margin-bottom: 10px; }
  .card .ttl { font-weight: 800; font-size: 20px; line-height: 1.15; margin-bottom: 12px; }

  /* The issue */
  .doc { max-width: 8.5in; margin: 28px auto 80px; }
  .page { background: var(--ivory); color: var(--ink); padding: 0.7in 0.75in; margin-bottom: 18px; position: relative; overflow: hidden; }
  .page.dark { background: var(--void); color: var(--ivory); }
  table.flow { width: 100%; border-collapse: collapse; }
  table.flow td { padding: 0; vertical-align: top; }
  table.flow td.sp { height: 0; }
  .rp-mark { width: 3.2in; height: auto; display: block; color: var(--ivory); }
  .credit { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mute); margin-top: 5px; }
  .dark .credit { color: #9A9A9A; }
  .ph { width: 100%; object-fit: cover; background: var(--matte); }
  .ph-wait { visibility: hidden; }
  .ph.blank { display: block; background: repeating-linear-gradient(135deg, var(--paper) 0 7px, var(--line) 7px 14px); }

  /* Cover */
  .cover { background: var(--void); color: var(--ivory); min-height: 11in; padding: 0; display: flex; flex-direction: column; }
  .cover .photo { position: absolute; inset: 0; }
  .cover .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.25) contrast(1.05); }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.15) 32%, rgba(10,10,10,.75) 62%, rgba(10,10,10,.97) 100%); }
  .cover .in { position: relative; padding: 0.6in 0.7in; display: flex; flex-direction: column; min-height: 11in; }
  .cover .kind { font-family: var(--mono); font-size: 11px; letter-spacing: 5px; color: var(--red); text-transform: uppercase; margin-top: auto; }
  .cover h1 { font-weight: 800; font-size: 64px; line-height: .95; margin: 14px 0 20px; letter-spacing: -1.5px; }
  .cover .thesis { font-size: 17px; line-height: 1.5; color: var(--cream); max-width: 6.2in; }
  .cover .foot { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; border-top: 2px solid var(--red); padding-top: 12px; margin-top: 26px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
  .nums { gap: 10px; }   /* SEAM:READ_LAYOUT: the cover's figures never run into each other */
  .nums b { display: block; font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -.5px; white-space: nowrap; }
  .nums span { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: #B8B2A6; }

  /* How to read + contents */
  .how { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 5px; color: var(--red); text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .kicker::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); display: inline-block; }
  .loop div { border-top: 2px solid var(--ink); padding: 10px 0 14px; }
  .loop b { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--red); display: block; margin-bottom: 4px; }
  .loop p { font-size: 14px; line-height: 1.55; }
  .toc div { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .toc .n { font-family: var(--mono); font-size: 11px; color: var(--red); padding-top: 3px; }
  .toc .t { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .toc .t small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: 1px; color: var(--mute); margin-top: 2px; text-transform: uppercase; }
  .intro { font-size: 13px; line-height: 1.6; color: var(--mute); margin-top: 18px; }
  /* SEAM:READ_THINK: a long contents (a RECON thought through runs past twenty sections) takes the full width in two columns, under the
     four ways to read, so it stays on one page */
  .how.long { grid-template-columns: 1fr; gap: 20px; }
  .how.long .loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 18px; }
  .how.long .loop p { font-size: 12px; line-height: 1.5; }
  .how.long .intro { margin-top: 8px; }
  .how.long .toc { column-count: 2; column-gap: 0.35in; }
  .how.long .toc div { break-inside: avoid; padding: 7px 0; }
  .how.longer .loop p { font-size: 11px; line-height: 1.45; } .how.longer .toc div { padding: 5px 0; } .how.longer .toc .t { font-size: 13.5px; } .how.longer .toc .t small { font-size: 8.5px; margin-top: 1px; }

  /* Section band and openers */
  .band { background: var(--void); color: var(--ivory); margin: -0.7in -0.75in 0.4in; padding: 0.45in 0.75in 0.4in; }
  .inner .band { margin-top: 0; }
  .band .no { font-family: var(--mono); font-size: 11px; letter-spacing: 4px; color: var(--red); }
  .band h2 { font-weight: 800; font-size: 44px; line-height: 1; margin: 8px 0 12px; letter-spacing: -.5px; }
  .band p { font-size: 14px; line-height: 1.55; color: #CFC8BA; max-width: 5.6in; }
  .opener { background: var(--void); color: var(--ivory); min-height: 11in; display: flex; flex-direction: column; justify-content: flex-end; padding: 0.8in 0.75in; }
  .opener .no { font-family: var(--mono); font-size: 12px; letter-spacing: 5px; color: var(--red); }
  .opener h2 { font-weight: 800; font-size: 96px; line-height: .9; margin: 14px 0 26px; letter-spacing: -2px; }
  .opener p { font-size: 18px; line-height: 1.5; color: #CFC8BA; max-width: 5.8in; margin-bottom: 30px; }
  .opener ol { list-style: none; border-top: 1px solid #333; }
  .opener li { display: grid; grid-template-columns: 40px 1fr; padding: 12px 0; border-bottom: 1px solid #222; font-weight: 700; font-size: 18px; }
  .opener li span { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--red); padding-top: 5px; }

  /* Body type */
  .body { font-size: 14.5px; line-height: 1.72; margin-bottom: 14px; }
  .lead { font-size: 17px; line-height: 1.6; }
  .cols { column-count: 2; column-gap: 0.32in; }
  .cols .body { break-inside: auto; }
  .cols .lead { font-size: 15.5px; line-height: 1.58; }
  .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin: 0 0 6px; break-after: avoid; }
  .mosaic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .mosaic figure { break-inside: avoid; }
  .mosaic figure .ph { height: 1.3in; }
  .mosaic figcaption { font-size: 10.5px; line-height: 1.35; margin-top: 5px; }

  /* Pattern spreads */
  .hero { margin: -0.7in -0.75in 0.32in; position: relative; }
  .inner .hero { margin-top: 0; }
  .hero .ph { height: 4.1in; }
  .hero .tag { position: absolute; left: 0.75in; bottom: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--ivory); background: var(--red); padding: 5px 9px; text-transform: uppercase; }
  .hero .credit { position: absolute; right: 0.75in; bottom: -16px; }
  .hero.none { height: 1.2in; background: var(--void); }
  .pname { font-weight: 800; font-size: 44px; line-height: 1.0; letter-spacing: -.6px; margin: 6px 0 14px; }
  .dek { font-weight: 700; font-size: 20px; line-height: 1.35; border-left: 4px solid var(--red); padding-left: 16px; margin: 0 0 22px; }
  .signal { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 6px; margin-left: 8px; vertical-align: middle; }
  .movebox { background: var(--void); color: var(--ivory); padding: 20px 22px; margin: 22px 0 18px; break-inside: avoid; }
  .movebox .h { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--red); margin-bottom: 4px; }
  .movebox .s { font-size: 12px; color: #B8B2A6; margin-bottom: 12px; }
  .movebox .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; }
  .movebox .grid div { border-top: 1px solid #333; padding-top: 8px; font-size: 12.5px; line-height: 1.5; }
  .movebox b { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 3px; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; break-inside: avoid; }
  .strip figure .ph { height: 0.95in; }
  .strip figcaption { font-size: 9.5px; line-height: 1.3; margin-top: 4px; }
  .strip figcaption span { font-family: var(--mono); color: var(--mute); }
  .ev { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1px; color: var(--mute); line-height: 1.6; margin-top: 10px; }

  .thread { display: grid; grid-template-columns: 1.3in 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .thread .ph { height: 1.3in; }
  .thread p { font-weight: 700; font-size: 17px; line-height: 1.35; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .two .pull { font-size: 19px; line-height: 1.25; }
  .pull { font-weight: 800; font-size: 26px; line-height: 1.2; margin: 6px 0 22px; }
  ul.watch { list-style: none; } ul.watch li { font-size: 15px; line-height: 1.6; padding: 12px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 30px 1fr; }
  ul.watch li span { font-family: var(--mono); color: var(--red); font-size: 12px; padding-top: 3px; }

  .bars div { display: grid; grid-template-columns: 1.7in 1fr 40px; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; }
  .bars i { display: block; height: 12px; background: var(--ink); }
  .bars i.r { background: var(--red); }
  .bars b { font-family: var(--mono); font-size: 11px; text-align: right; }
  .bigs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 26px; }
  .bigs div { border-top: 3px solid var(--ink); padding-top: 8px; }
  .bigs b { display: block; font-weight: 800; font-size: 40px; line-height: 1; }
  .bigs span { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); }

  .rc { display: grid; grid-template-columns: 0.7in 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .rc .ph, .rc .noimg { height: 0.5in; }
  .noimg { background: var(--paper); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9px; color: var(--mute); }
  .rc .hl { font-size: 11.5px; line-height: 1.4; }
  .rc .src { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--mute); text-transform: uppercase; }
  .closer { background: var(--void); color: var(--ivory); min-height: 11in; display: flex; flex-direction: column; justify-content: center; }
  .closer .big { font-weight: 800; font-size: 56px; line-height: 1; margin: .35in 0 .3in; }
  .closer .url { font-family: var(--mono); font-size: 12px; letter-spacing: 3px; color: var(--red); text-transform: uppercase; }
  .hold { background: #2A1A08; color: #F2C48D; font-family: var(--mono); font-size: 12px; line-height: 1.7; padding: 14px 18px; margin-bottom: 18px; border: 1px solid #F2994A; }

  /* Social frames */
  .social { max-width: 1100px; margin: 0 auto 80px; padding: 0 20px; }
  .social h2 { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 14px; }
  .hs-frames { max-width: 1100px; margin: 0 auto 40px; padding: 0 20px; }   /* SEAM:DAY_FRAMES (RD1b) */
  .fr-h { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin: 34px 0 12px; font-weight: 400; }
  .fr-say { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: #9A9A9A; margin-left: 8px; }
  .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .frames figure { border: 1px solid #2A2A2A; }
  .frames canvas { width: 100%; height: auto; display: block; }
  .frames figcaption { display: flex; justify-content: space-between; align-items: center; padding: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; }
  .cap { font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--cream); border: 1px solid #2A2A2A; padding: 14px; white-space: pre-wrap; margin-top: 10px; }

  /* SEAM:READ_REPORT: the research layout. Data cards, chips, sparklines, supports, voices. Same paper, same type. */
  .rp-issue { font-family: var(--mono); font-size: 12px; letter-spacing: 6px; text-transform: uppercase; color: var(--ivory); margin-bottom: 8px; }
  .rp-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: #B8B2A6; margin-top: 14px; line-height: 1.6; }
  .rp-exec { list-style: none; counter-reset: ex; }
  .rp-exec li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; font-weight: 700; }
  .rp-exec li span { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--red); padding-top: 4px; }
  .rp-exec .ev { font-weight: 400; margin-top: 4px; }
  .rp-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; margin: 0 0 22px; }
  .rp-card { border-top: 3px solid var(--ink); padding-top: 8px; break-inside: avoid; }
  .rp-card b { display: block; font-weight: 800; font-size: 30px; line-height: 1; }
  .rp-card span { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); margin-top: 4px; }
  .rp-card small { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--ink); margin-top: 3px; }
  .rp-chip { display: inline-block; font-family: var(--mono); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 7px; vertical-align: middle; }
  .rp-chip.rising, .rp-chip.new { background: var(--red); color: var(--ivory); border-color: var(--red); }
  .rp-chip.cooling { color: var(--mute); border-color: var(--line); }
  .rp-chip.high { background: var(--ink); color: var(--ivory); }
  .rp-chip.low { color: var(--mute); border-color: var(--line); }
  .rp-data { background: var(--cream); border-left: 4px solid var(--red); padding: 14px 16px; margin: 0 0 18px; font-size: 13.5px; line-height: 1.62; break-inside: avoid; }
  .rp-data .lbl { margin-bottom: 4px; }
  .rp-means { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 6px 0 16px; }
  .rp-means { break-inside: avoid; }   /* SEAM:READ_LAYOUT: the three "for the" columns stay with their headers */
  .rp-means div { border-top: 1px solid var(--ink); padding-top: 6px; font-size: 12.5px; line-height: 1.5; }
  .rp-means b { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 3px; }
  .rp-sup { list-style: none; margin-top: 10px; }
  .rp-sup li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.4; }
  .rp-sup li span { font-family: var(--mono); color: var(--red); font-size: 10px; padding-top: 2px; }
  .rp-sup li i { display: block; font-style: normal; font-family: var(--mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); margin-top: 2px; }
  .rp-trig { font-size: 13px; line-height: 1.55; margin-top: 12px; padding: 10px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  .rp-trig b { display: block; font-family: var(--mono); font-weight: 400; font-size: 9px; letter-spacing: 3px; color: var(--red); margin-bottom: 3px; }
  /* SEAM:REPORT_BRIEF: the report on one page, the recurrence line, what cuts against, the pull quotes, the dot strip */
  .rp-brief .thesis { font-weight: 700; font-size: 14px; line-height: 1.38; margin: 0 0 10px; column-count: 2; column-gap: 0.3in; }
  .rp-brief .row { display: grid; grid-template-columns: 2.5in 1fr; gap: 0 22px; align-items: start; margin: 0 0 8px; break-inside: avoid; }
  .rp-brief .rp-cards { grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0; }
  .rp-brief .rp-card b { font-size: 20px; }
  .rp-brief .rp-chart { margin: 0; } .rp-brief .rp-chart svg { height: 84px; }
  .rp-brief .rp-exec { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; column-gap: 0.3in; }
  .rp-brief .rp-exec li { font-size: 10px; line-height: 1.42; padding: 5px 0; grid-template-columns: 22px 1fr; break-inside: avoid; }
  .rp-brief .rp-exec li span { font-size: 9.5px; padding-top: 3px; }
  .rp-rec2 { column-count: 3; column-gap: 0.22in; }
  .rp-rec2 > div { break-inside: avoid; }
  .rp-rec2 .rc { break-inside: avoid; display: grid; grid-template-columns: 26px 1fr; gap: 5px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 9.5px; line-height: 1.3; }

  }
  /* The WEEKLY issue's frames, as before: the copy from the read, the photographs from its receipts. */
  function social(row, s, rc, img, coverPool) {
    return framesSection({ label: row.label, sub: "THE WEEKLY READ · SWIPE", slug: "unsurfaced-daily-" + String(row.window_start), h2: "The Unsurfaced DAILY issue", s: s,
      pools: s.frames.map(function (f) { return (f.evidence || []).filter(function (x) { return rc[x]; }); }), coverPool: coverPool, img: img,
      credit: function (sid) { return "Photo: " + ((rc[sid] && rc[sid].source_name) || ""); } });
  }
  /* ── The reel: the frames in motion, encoded in this browser ────────── */
  /* PURE: the reel's frame program over n frames. The doctrine's motion language: typographic, cut on the beat, holds
     confident, type arrives like a stamp, never a slide. Each frame holds HOLD frames, then GAP black frames; the out is
     black with the red dot and the wordmark. ops: fill, frame (an index), dot, text. */
  var REEL = { W: 1080, H: 1350, FPS: 30, HOLD: 84, GAP: 6, OUT: 36 };
  function reelProgram(n) {
    var per = REEL.HOLD + REEL.GAP, total = n * per + REEL.OUT;
    return { w: REEL.W, h: REEL.H, fps: REEL.FPS, total: total, at: function (f) {
      var ops = [{ op: "fill", color: C.void }];
      if (f >= n * per) {
        ops.push({ op: "dot", x: 540, y: 640, r: 14, color: C.red });
        ops.push({ op: "text", text: "UNSURFACED™ DAILY", x: 540, y: 720, size: 30, weight: "700", color: C.ivory, align: "center" });
        return ops;
      }
      var i = Math.floor(f / per), k = f - i * per;

  function reelPaint(canvas, frames, w, h, ops) {
    if (canvas.width !== w) canvas.width = w;

  /* WebCodecs plus the vendored mp4-muxer (./mp4-muxer.js). Null when this browser cannot encode. */

    var muxer = new Mp4Muxer.Muxer({ target: target, fastStart: "in-memory", video: { codec: "avc", width: program.w, height: program.h } });
    var encoder = new VideoEncoder({ output: function (chunk, meta) { muxer.addVideoChunk(chunk, meta); }, error: function (e) { console.log("encode_error", e); } });
    encoder.configure({ codec: "avc1.640028", width: program.w, height: program.h, bitrate: 9000000, framerate: program.fps });

  function reelRender(frames, slug, btn, say) {
    if (btn.disabled) return;
    btn.disabled = true; if (say) say.textContent = "Encoding.";
    var program = reelProgram(frames.length);
    buildMp4(program, function (cv, w, h, ops) { reelPaint(cv, frames, w, h, ops); }, function (f, total) { if (say) say.textContent = "Encoding " + Math.round(100 * f / total) + "%."; })
      .then(function (blob) {
        if (!blob) { if (say) say.textContent = "This browser cannot encode video here. Chrome or Edge can."; btn.disabled = false; return; }
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = slug + "-reel.mp4"; a.click();
        if (say) say.textContent = "The reel: " + frames.length + " frames, " + Math.round(program.total / program.fps) + " seconds, 1080 × 1350.";
        btn.disabled = false;

  }
  /* ── The day's frames in the DAILY room ─────────────────────────────── */
  function dayFramesCall(issue, body) { return call("/reads/day-frames", Object.assign({ issue: issue }, body || {})); }
  function dayFramesPanel(ed, items, mount) {
    var panel = document.createElement("div"); panel.className = "hs-frames"; panel.innerHTML = '<div class="hs-note">Reading the day\'s frames.</div>';

      .catch(function () { dayFramesShow(ed, items, panel, null, "no answer"); });
  }
  function dayFramesShow(ed, items, panel, fr, err) {
    var byId = {}; items.forEach(function (it) { byId[String(it.id)] = it; });
    var head = '<h2 class="fr-h">The frames</h2>';
    var written = fr && fr.status && fr.status !== "feed_only";
    var note = err ? "The frames could not load: " + err + "." :
      !fr ? "No frames yet for this day. The writer prepares them after DAILY publishes; write them now if the morning missed." :
      fr.status === "held" ? "Held: " + (fr.hold || []).join(", ") + ". Nothing is drawn from a held set; write it again." :
      fr.status === "feed_only" ? "A drop from the feed sits on this day; the writer's frames are not written yet." :
      "Written " + (fr.at ? hsDay(String(fr.at).slice(0, 10)) : "") + " by " + esc(fr.by || "") + (fr.cost_usd != null ? ", $" + Number(fr.cost_usd).toFixed(2) : "") + ". The WEEKLY grammar on the day: a cover, one frame per story over its photograph, a closer.";
    var btn = !fr || fr.status === "feed_only" ? '<button class="btn red" data-df="make">Write the day\'s frames</button>' : '<button class="btn" data-df="remake">Write the frames again</button>';
    panel.innerHTML = head + '<div class="hs-note">' + note + "</div>" + btn + ' <span class="fr-say" data-df="say"></span>';
    var b = panel.querySelector("[data-df]"), say = panel.querySelector('[data-df="say"]');

      dayFramesCall(ed.issue_no, b.getAttribute("data-df") === "remake" ? { remake: true } : { make: true }).then(function (d) {

    var fidx = [], frames = fr.frames.filter(function (f, i) { if (f && f.headline) { fidx.push(i); return true; } return false; });   /* SEAM:VIDEO_DOOR (RD1c): the slot paths keep the set's own indices */

    framesSection({ label: "DAILY · No. " + ed.issue_no + " · " + hsDay(ed.date), sub: "THE DAILY · " + hsDay(ed.date).toUpperCase() + " · SWIPE",
      slug: "unsurfaced-daily-" + String(ed.date), h2: "The day\'s frames", s: { cover_line: fr.cover_line, frames: frames, caption: fr.caption },
      pools: frames.map(function (f, j) { return dayFramePool(fr, "frames[" + fidx[j] + "]", f.item_id); }), coverPool: coverPool.length ? coverPool : items.map(function (it) { return String(it.id); }),
      img: function (id) { return dayFrameImg(byId, id); },
      credit: function (id) { return dayFrameCredit(fr, byId, id); }, mount: panel,
      extra: ' <button class="btn" data-fr="slots">The slots</button>' }).then(function (wrapEl) {   /* SEAM:VIDEO_DOOR (RD1c): the cover and one slot per frame, the same doors as a read */
        var sb = wrapEl && wrapEl.querySelector('[data-fr="slots"]'); if (sb) sb.onclick = function () { SL.path = "cover"; SL.pick = null; slotsOpen(dayRow(ed, items, fr), null); };
      });
  }
  /* Minimal PDF: one JPEG page per frame (DCTDecode), the LinkedIn document-post shape. */
  function pdfOf(frames) {
    var enc = new TextEncoder(), parts = [], offs = [], len = 0;
    function push(x) { var b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); len += b.length; }

      var p = 3 + i * 3, im = p + 1, ct = p + 2, draw = "q " + W + " 0 0 " + H + " 0 0 cm /Im0 Do Q";
      obj(p, function () { push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /XObject << /Im0 " + im + " 0 R >> >> /Contents " + ct + " 0 R >>"); });
      obj(im, function () { push("<< /Type /XObject /Subtype /Image /Width 1080 /Height 1350 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.length + " >>\nstream\n"); push(img); push("\nendstream"); });
      obj(ct, function () { push("<< /Length " + draw.length + " >>\nstream\n" + draw + "\nendstream"); });

    var total = 3 + n * 3, xref = len, x = "xref\n0 " + total + "\n0000000000 65535 f \n";
    for (var k = 1; k < total; k++) x += String(offs[k]).padStart(10, "0") + " 00000 n \n";

  }
